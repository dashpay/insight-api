name: Test and Release

on:
  workflow_dispatch:
  release:
    types:
      - published
  pull_request:
    branches:
      - master
      - v[0-9]+.[0-9]+-dev

jobs:
  test:
    name: Run Insight API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable NPM cache
        uses: actions/cache@v4
        with:
          path: '~/.npm'
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install NPM dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  functional:
    name: Run Insight API functional tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DASH_VERSION: 24.0.0
      DASH_SHA256: 1ffce395e035fb2ee617c92e6eeaab139ca3d10db6f83d4e816136b726512c5e
      DASHCORE_NODE_REF: 6b165203b9b0eb2bd338bb92e9ddee2708f75b97
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: dashpay/dashcore-node
          ref: ${{ env.DASHCORE_NODE_REF }}
          path: dashcore-node

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable NPM cache
        uses: actions/cache@v4
        with:
          path: '~/.npm'
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install NPM dependencies
        run: |
          npm ci
          npm ci --prefix dashcore-node
          echo "DASHCORE_NODE_PATH=$PWD/dashcore-node" >> "$GITHUB_ENV"

      - name: Download Dash Core
        run: |
          curl -fsSL -o dashcore.tar.gz "https://github.com/dashpay/dash/releases/download/v${DASH_VERSION}/dashcore-${DASH_VERSION}-x86_64-linux-gnu.tar.gz"
          echo "${DASH_SHA256}  dashcore.tar.gz" | sha256sum -c -
          tar xzf dashcore.tar.gz
          echo "DASHD_PATH=$PWD/dashcore-${DASH_VERSION}/bin/dashd" >> "$GITHUB_ENV"

      - name: Run functional tests
        run: npm run test:functional

  release-npm:
    name: Release NPM package
    runs-on: ubuntu-24.04
    needs: [test, functional]
    # A release publishes the package. A manual run only rehearses the publish:
    # it packs the package and checks that npm accepts this workflow as a
    # trusted publisher, and publishes nothing.
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    # npm trusted publishing: npm exchanges the job's OIDC token for a publish
    # token, so no NPM_TOKEN secret is needed
    permissions:
      contents: read
      id-token: write
    # Every step here can request an npm publish token, so only GitHub's own
    # actions run, pinned to commits, and the checks are plain shell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Trusted publishing needs npm 11.5.1 or later. No registry-url: with it,
      # setup-node writes a token entry to .npmrc and npm tries token auth
      # instead of the OIDC exchange.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.1'

      - name: Check package version matches tag
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version v$VERSION"
            exit 1
          fi

      # X.Y-dev for dev releases, latest otherwise
      - name: Set release tag
        id: tag
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$RELEASE_TAG" == *dev* ]]; then
            [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+) ]]
            echo "result=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}-dev" >> "$GITHUB_OUTPUT"
          else
            echo "result=latest" >> "$GITHUB_OUTPUT"
          fi

      # Packs the checkout as earlier releases did. The package has no build
      # step, and nothing is installed in this job, so no package script runs
      # while the OIDC token is available. Trusted publishing adds a provenance
      # attestation, which requires package.json's repository.url to name this
      # repository.
      - name: Publish NPM package
        if: ${{ github.event_name == 'release' }}
        env:
          NPM_TAG: ${{ steps.tag.outputs.result }}
        run: npm publish --ignore-scripts --access public --tag "$NPM_TAG"

      # npm does the OIDC exchange on a dry run too, and without a token a dry
      # run only warns, so the result is read from npm's verbose log. The text
      # matched is the one printed by the npm that ships with the Node version
      # pinned above.
      - name: Rehearse the publish
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          LOG="$RUNNER_TEMP/npm-publish-dry-run.log"
          npm publish --dry-run --ignore-scripts --access public --loglevel verbose 2>&1 | tee "$LOG"
          if ! grep -q 'oidc Successfully retrieved and set token' "$LOG"; then
            echo "::error::npm did not accept this workflow as a trusted publisher of this package. See the oidc lines above."
            exit 1
          fi

  release-docker:
    name: Release Docker image
    runs-on: ubuntu-24.04
    needs: release-npm
    if: ${{ github.event_name == 'release' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set suffix to Docker tags
        uses: actions/github-script@v7
        id: suffix
        with:
          result-encoding: string
          script: "return (context.payload.release.tag_name.includes('-dev') ? '-dev' : '');"

      - name: Set Docker tags and labels
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: dashpay/insight-api
          tags: |
            type=match,pattern=v(\d+),group=1
            type=match,pattern=v(\d+.\d+),group=1
            type=match,pattern=v(\d+.\d+.\d+),group=1
            type=match,pattern=v(.*),group=1,suffix=,enable=${{ contains(github.event.release.tag_name, '-dev') }}
          flavor: |
            latest=${{ !contains(github.event.release.tag_name, '-dev') }}
            suffix=${{ steps.suffix.outputs.result }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: VERSION=${{ github.event.release.tag_name }}  

      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896

      - name: Run temporary fix for Docker cache action
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Output Docker image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
